<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login y Registro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/estilos.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="text/Javascript" src="js/main.js"></script>
</head>
<body>
    <div class="container mt-5">
        <!-- Formulario de inicio de sesión -->
        <div id="formularioLogin" class="form-container border rounded p-4 shadow-sm bg-white">
            <h2 class="text-center mb-4">Iniciar Sesión</h2>
            <form>
                <div class="mb-3">
                    <label for="correoLogin" class="form-label">Email</label>
                    <input type="email" class="form-control" id="correoLogin" required>
                </div>
                <div class="mb-3">
                    <label for="contrasenaLogin" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasenaLogin" required>
                </div>
                <!-- Botón para iniciar sesión -->
                <button type="button" class="btn btn-primary w-100" onclick="iniciarSesion()">Iniciar Sesión</button>
            </form>
            <p class="cambiarFormulario text-center mt-3"><a href="#" onclick="cambiarFormulario()">¿No tienes una cuenta? Regístrate</a></p>
        </div>


        <!-- Formulario de registro -->
        <div id="formularioRegistro" class="form-container border rounded p-4 shadow-sm bg-white" style="display:none;">
            <h2 class="text-center mb-4">Registrarse</h2>
            <form>
                <div class="mb-3">
                    <label for="correoRegistro" class="form-label">Email</label>
                    <input type="email" class="form-control" id="correoRegistro" required>
                </div>
                <div class="mb-3">
                    <label for="contrasenaRegistro" class="form-label">Contraseña</label>
                    <input type="password" class="form-control" id="contrasenaRegistro" required>
                </div>
                <div class="mb-3">
                    <label for="confirmarContrasenaRegistro" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirmarContrasenaRegistro" required>
                </div>
                <!-- Botón para registrarse -->
                <button type="button" class="btn btn-primary w-100" onclick="registrarUsuario()">Registrarse</button>
            </form>
            <p class="cambiarFormulario text-center mt-3"><a href="#" onclick="cambiarFormulario()">¿Ya tienes una cuenta? Inicia Sesión</a></p>
        </div>
    </div>
</body>
</html>
