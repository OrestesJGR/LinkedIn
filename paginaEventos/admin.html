<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/1.13.5/css/jquery.dataTables.min.css">
    <link rel="stylesheet" href="css/estilos.css">    
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.5/js/jquery.dataTables.min.js"></script>
    <script type="text/JavaScript" src="js/main.js"></script>
</head>
<body>
    <nav class="navbar navbar-light bg-light">
        <!-- Título del panel de administración -->
        <span class="navbar-brand mb-0 h1">Panel de Administración</span>
        <!-- Botón para cerrar sesión -->
        <button class="btn btn-outline-danger" onclick="cerrarSesion()">Cerrar Sesión</button>
    </nav>
    <div class="container table-container mt-4">
        <!-- Tabla para mostrar los usuarios registrados -->
        <table id="tablaUsuarios" class="table table-striped">
            <thead>
                <tr>
                    <th>Email</th>
                </tr>
            </thead>
            <tbody>
                <!-- Usuarios serán agregados aquí por JavaScript -->
            </tbody>
        </table>
    </div>

</body>
</html>
